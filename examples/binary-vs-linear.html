<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二分探索とリニアサーチ</title>
<!--
  dpgk HTML プレイヤーのひな形。
  書き換えるのは「図のスタイル」「header」「#scene の SVG」「図のスクリプト（beats と render）」だけ。
  dpgk-player:start〜end で囲まれた 3 ブロック（CSS / 操作ボタン / プレイヤーのスクリプト）は編集しない。
  scripts/dpgk_sync_player.py がこのひな形の最新版で上書きする。
-->
<style>
  /* dpgk-player:start v14 */
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #d6d3d1;
    --node: #ffffff; --accent: #2563eb; --bad: #dc2626; --good: #16a34a;
    --dur: 600ms;
  }
  /* ダーク配色: OS の設定に従う（自動）か、表示ボタンで選んだもの（html の data-theme）に従う */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --node: #292524; --accent: #60a5fa; --bad: #f87171; --good: #4ade80; }
  }
  :root[data-theme="dark"] { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --node: #292524; --accent: #60a5fa; --bad: #f87171; --good: #4ade80; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  /* 画面全体を使う: 見出しと操作は最小限、残りの高さはすべて図に渡す */
  main { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; }
  header { flex: none; }
  h1 { font-size: 1.15rem; margin: 0; }
  .q { color: var(--muted); margin: 0; font-size: .95rem; }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .stage > svg { flex: 1; min-height: 0; width: 100%; height: 100%; display: block; }
  .badge { position: absolute; top: 8px; right: 8px; padding: 2px 10px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: .85rem; font-weight: 700; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 1; }
  .badge.show { opacity: .85; }
  .caption { flex: none; min-height: 3.2em; margin: 4px 0 0; font-size: clamp(1rem, 2.2vw, 1.35rem); }
  [data-k] { transition: opacity var(--dur) ease-out, transform var(--dur) ease-in-out; }
  /* 出し入れはプレイヤーの役目なので、図のスタイル側の opacity より必ず勝たせる */
  [data-k].off { opacity: 0 !important; }
  [data-k].dim { opacity: .25 !important; }
  .controls { flex: none; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--node); color: var(--fg); cursor: pointer; }
  .controls button:focus-visible, .controls select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .speed { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: .9rem; }
  .controls select { font: inherit; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--node); color: var(--fg); }
  .dots { display: flex; gap: 6px; margin-left: auto; }
  .dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; }
  .dots button[aria-current="step"] { background: var(--accent); border-color: var(--accent); }
  #fs[hidden] { display: none; }
  [data-feed="story"] .progress { display: none; }
  /* 再生バー: 画面の上辺に、全体のどこまで進んだかだけを示す（時間表示なし） */
  .progress { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: var(--line); z-index: 10; pointer-events: none; }
  .progress > i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
  /* 縦長の画面では縦向きの図に切り替える（#scene に data-viewbox-portrait があるときだけ） */
  [data-orient="portrait"] .only-landscape, [data-orient="landscape"] .only-portrait { display: none; }
  /* スマホ: 見出し・説明・操作を詰めて、図に高さを渡す。速度はジェスチャー（長押し・ドラッグ）で変えられるので選択欄は隠す */
  @media (max-width: 480px) {
    main { padding: 8px 12px; gap: 4px; }
    h1 { font-size: 1rem; }
    .q { font-size: .82rem; line-height: 1.4; }
    .caption { font-size: .95rem; line-height: 1.45; min-height: 2.9em; }
    .controls { flex-wrap: nowrap; gap: 6px; }
    .controls button { padding: 4px 10px; }
    .speed, #fs { display: none; }
    .dots { gap: 4px; }
    .controls .dots button { width: 10px; height: 10px; padding: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --dur: 0ms; }
  }
  /* dpgk-player:end */

  /* ここから図のスタイル（自由に書き換える） */
  :root { --seen: #a8a29e; --cand: #dbeafe; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --line: #57534e; --seen: #78716c; --cand: #1e3a5f; } }
  :root[data-theme="dark"] { --line: #57534e; --seen: #78716c; --cand: #1e3a5f; }
  .inputs { display: grid; grid-template-columns: auto 1fr auto; gap: 0 10px; align-items: center; margin: 2px 0 0; font-size: .9rem; }
  .inputs output { font-variant-numeric: tabular-nums; min-width: 7.5em; text-align: right; }
  .inputs input[type=range] { width: 100%; accent-color: var(--accent); }
  .step1 { display: flex; gap: 6px; padding: 2px 0; }
  .step1 button { font: inherit; padding: 1px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--node); color: var(--fg); cursor: pointer; }
  .inputs input:focus-visible, .step1 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 480px) {
    h1 { font-size: 1rem; }
    .q, .inputs { font-size: .85rem; line-height: 1.45; }
  }
  svg text { fill: var(--fg); font-size: 15px; }
  svg .sub { fill: var(--muted); font-size: 13px; }
  [data-orient="portrait"] svg .sub { font-size: 14px; }
  svg .num { font-size: 12px; text-anchor: middle; pointer-events: none; }
  svg .big { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cell { fill: var(--node); stroke: var(--line); stroke-width: 1; transition: fill var(--dur) ease-out, opacity var(--dur) ease-out; }
  .cell.seen { fill: var(--seen); }
  .cell.probe { fill: var(--accent); }
  .cell.found { fill: var(--good); stroke: var(--fg); stroke-width: 2; }
  .cell.cand { fill: var(--cand); }
  .cell.out { opacity: .35; }
  .num.out { opacity: .3; }
  .mark { fill: var(--fg); transition: transform var(--dur) ease-in-out, opacity var(--dur) ease-out; }
  .range { stroke: var(--accent); stroke-width: 3; }
  .bar { transform-box: fill-box; transform-origin: left; transition: transform var(--dur) ease-in-out; }
  .bar-lin { fill: var(--seen); } .bar-bin { fill: var(--accent); }
  /* 縦向き（viewBox 360 幅）: 副題を 2 行目に回して各段を下へずらし、凡例を 2 行にする。横幅は render が変える */
  [data-orient="portrait"] .body { transform: translateY(20px); }
  [data-orient="portrait"] [data-k="bin"] { transform: translateY(20px); }
  [data-orient="portrait"] [data-k="chart"] { transform: translateY(42px); }
  [data-orient="portrait"] [data-k="legend"] { transform: translateY(36px); }
  [data-orient="portrait"] .lg4 { transform: translate(-255px, 24px); }
  [data-orient="portrait"] .lg5 { transform: translate(-235px, 24px); }
</style>
</head>
<body>
<main>
  <header>
    <h1>二分探索とリニアサーチ：比較回数の違い</h1>
    <p class="q">問い: 配列が大きくなると、目的の値を見つけるまでの比較回数はそれぞれどう増えるのか</p>
    <div class="inputs">
      <label for="n">配列サイズ n</label><input id="n" type="range" min="4" max="1024" value="30"><output id="nOut" for="n"></output>
      <label for="t">探す値の位置</label><input id="t" type="range" min="1" max="30" value="22"><output id="tOut" for="t"></output>
      <span>1 回ずつ</span><span class="step1"><button id="minus" aria-label="比較を 1 回戻す">−1</button><button id="plus" aria-label="比較を 1 回進める">+1</button></span><span></span>
    </div>
  </header>

  <!-- 縦型動画と同じ操作: タップで一時停止/再開、長押ししている間だけ 2×。#stage / #badge / #caption は必須 -->
  <div class="stage" id="stage">
    <div class="badge" id="badge" aria-hidden="true"></div>
    <svg id="scene" viewBox="0 0 640 446" data-viewbox-portrait="0 0 360 510" role="img" aria-labelledby="scene-title">
      <title id="scene-title">同じ整列済み配列で、リニアサーチは先頭から1つずつ、二分探索は中央と比べて候補を半分に絞りながら値を探す様子と、最悪ケースの比較回数の比較</title>
      <rect width="100%" height="100%" fill="var(--bg)"/>
      <g data-k="lin">
        <text x="20" y="32">リニアサーチ<tspan class="sub only-landscape">（先頭から順に比べる）</tspan></text>
        <text class="sub only-portrait" x="20" y="52">先頭から順に比べる</text>
        <text id="linCount" class="big right" x="620" y="32" text-anchor="end"></text>
        <g class="body">
          <g id="lin"></g>
          <path id="linMark" class="mark" d="M-7,0 L7,0 L0,-10 Z"/>
          <text id="linNote" class="sub" x="20" y="122"></text>
        </g>
      </g>
      <g data-k="bin">
        <text x="20" y="162">二分探索<tspan class="sub only-landscape">（中央と比べ、半分を捨てる）</tspan></text>
        <text class="sub only-portrait" x="20" y="182">中央と比べ、半分を捨てる</text>
        <text id="binCount" class="big right" x="620" y="162" text-anchor="end"></text>
        <g class="body">
          <g id="bin"></g>
          <path id="binMark" class="mark" d="M-7,0 L7,0 L0,-10 Z"/>
          <line id="binRange" class="range" x1="20" x2="620" y1="234" y2="234"/>
          <text id="binNote" class="sub" x="20" y="256"></text>
        </g>
      </g>
      <g data-k="chart">
        <line class="rule right" x1="20" x2="620" y1="280" y2="280" stroke="var(--line)"/>
        <text id="chartTitle" x="20" y="306"></text>
        <rect class="bar bar-lin" id="barLin" x="20" y="318" width="600" height="20" rx="3"/>
        <text id="barLinT" class="sub" x="20" y="354"></text>
        <rect class="bar bar-bin" id="barBin" x="20" y="362" width="600" height="20" rx="3"/>
        <text id="barBinT" class="sub" x="20" y="398"></text>
      </g>
      <!-- 凡例: マスの色の意味 -->
      <g data-k="legend">
        <g class="lg1"><rect class="cell probe" x="20" y="422" width="14" height="14"/><text class="sub" x="40" y="434">いま比べた</text></g>
        <g class="lg2"><rect class="cell seen" x="125" y="422" width="14" height="14"/><text class="sub" x="145" y="434">違った</text></g>
        <g class="lg3"><rect class="cell found" x="205" y="422" width="14" height="14"/><text class="sub" x="225" y="434">発見</text></g>
        <g class="lg4"><rect class="cell cand" x="275" y="422" width="14" height="14"/><text class="sub" x="295" y="434">残り候補（青線）</text></g>
        <g class="lg5"><rect class="cell out" x="410" y="422" width="14" height="14"/><text class="sub" x="430" y="434">候補から外れた</text></g>
      </g>
    </svg>
    <p class="caption" id="caption" aria-live="polite"></p>
  </div>

  <!-- dpgk-player:start v14 -->
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  <div class="controls">
    <button id="prev" aria-label="前のステップ">←</button>
    <button id="play" aria-label="再生">再生</button>
    <button id="next" aria-label="次のステップ">→</button>
    <label class="speed">速度
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </label>
    <button id="theme" aria-label="配色の切り替え（自動 / ライト / ダーク）">自動</button>
    <button id="fs" aria-label="全画面表示" hidden>全画面</button>
    <div class="dots" id="dots"></div>
  </div>
  <!-- dpgk-player:end -->
</main>

<script>
  // ここから図のスクリプト（自由に書き換える）
  // beats: 各ビートの最終状態。s(): [リニアの比較回数, 二分探索の比較回数] / on: 表示する data-k / ms: このビートの長さ
  // render(b, i): s() と (n, t) と画面の向きから、マス・印・数字を描く（直前の状態に依存しない）
  const BEAT_MS = 3000;   // 1× のときの 1 ビートの長さ
  const $ = s => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const X0 = 20, LIN_Y = 44, BIN_Y = 174, CELL_H = 40;
  const val = i => i * 2 + 1;               // 整列済み配列: 1, 3, 5, ...
  const fmt = x => x.toLocaleString("ja-JP");
  const worstBin = n => Math.floor(Math.log2(n)) + 1;

  // 二分探索の各比較: 比べた位置 m と、その比較の後に残る候補 [lo, hi]
  function binSteps(n, t) {
    let lo = 0, hi = n - 1; const steps = [];
    while (lo <= hi) {
      const m = (lo + hi) >> 1;
      if (m === t) { steps.push({ m, lo: t, hi: t, found: true }); break; }
      if (m < t) lo = m + 1; else hi = m - 1;
      steps.push({ m, lo, hi, found: false });
    }
    return steps;
  }

  let n, t, S, K, L;   // K: 二分探索の比較回数, L: リニアサーチの比較回数
  function readInputs() {
    n = Number($("#n").value);
    $("#t").max = n;
    t = Math.min(Number($("#t").value), n) - 1;
    S = binSteps(n, t); K = S.length; L = t + 1;
    $("#nOut").textContent = `${fmt(n)} 個`;
    $("#tOut").textContent = `${fmt(t + 1)} 番目（値 ${fmt(val(t))}）`;
  }

  // 図の横幅: 横向き 600、縦向き 320（viewBox 360 幅）。n か向きが変わったときだけマスを作り直す
  let W = 600, built = "";
  function build() {
    W = document.documentElement.dataset.orient === "portrait" ? 320 : 600;
    if (built === `${n}/${W}`) return;
    built = `${n}/${W}`;
    document.querySelectorAll("#scene .right").forEach(e => e.setAttribute(e.tagName === "line" ? "x2" : "x", X0 + W));
    for (const id of ["#barLin", "#barBin"]) $(id).setAttribute("width", W);
    const cw = W / n, showNum = cw >= 20;
    for (const [id, y] of [["lin", LIN_Y], ["bin", BIN_Y]]) {
      const g = $("#" + id); g.textContent = "";
      for (let i = 0; i < n; i++) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", X0 + i * cw); r.setAttribute("y", y);
        r.setAttribute("width", cw); r.setAttribute("height", CELL_H);
        r.setAttribute("class", "cell");
        if (cw < 3) r.style.strokeWidth = 0;
        g.append(r);
        if (showNum) {
          const tx = document.createElementNS(NS, "text");
          tx.setAttribute("x", X0 + (i + .5) * cw); tx.setAttribute("y", y + 25);
          tx.setAttribute("class", "num"); tx.textContent = val(i);
          g.append(tx);
        }
      }
    }
  }
  const cx = i => X0 + (i + .5) * (W / n);

  // リニアを sLin 回、二分探索を sBin 回比べた時点の状態を描く
  function draw(sLin, sBin) {
    build();
    const lc = $("#lin").querySelectorAll("rect");
    const linFound = sLin >= L, l = Math.min(sLin, L);
    lc.forEach((r, i) => r.setAttribute("class", "cell" +
      (linFound && i === t ? " found" : i < l - 1 ? " seen" : i === l - 1 ? " probe" : "")));
    $("#linMark").style.transform = `translate(${cx(Math.max(l - 1, 0))}px, ${LIN_Y + CELL_H + 12}px)`;
    $("#linMark").classList.toggle("off", l === 0);
    $("#linCount").textContent = `比較 ${fmt(l)} 回${linFound ? "で発見" : ""}`;
    $("#linNote").textContent = linFound ? `${fmt(t + 1)} 番目で見つかった` : `残りの候補 ${fmt(n - l)} 個（1回で1個しか減らない）`;

    const bc = $("#bin").querySelectorAll("rect");
    const b = Math.min(sBin, K), st = b ? S[b - 1] : { lo: 0, hi: n - 1, found: false };
    const seenSet = new Set(S.slice(0, b).map(x => x.m));
    bc.forEach((r, i) => r.setAttribute("class", "cell" +
      (st.found && i === t ? " found" :
       (b && i === S[b - 1].m) ? " probe" :
       seenSet.has(i) ? " seen out" :
       (b && i >= st.lo && i <= st.hi) ? " cand" :
       (i < st.lo || i > st.hi) ? " out" : "")));
    $("#bin").querySelectorAll("text").forEach((tx, i) => tx.setAttribute("class", "num" + (bc[i].classList.contains("out") ? " out" : "")));
    $("#binMark").style.transform = `translate(${cx(b ? S[b - 1].m : 0)}px, ${BIN_Y + CELL_H + 12}px)`;
    $("#binMark").classList.toggle("off", b === 0);
    const r = $("#binRange");
    r.setAttribute("x1", X0 + st.lo * (W / n)); r.setAttribute("x2", X0 + (st.hi + 1) * (W / n));
    $("#binCount").textContent = `比較 ${fmt(b)} 回${st.found ? "で発見" : ""}`;
    $("#binNote").textContent = st.found ? `${fmt(t + 1)} 番目で見つかった` : `残りの候補 ${fmt(st.hi - st.lo + 1)} 個（1回で半分になる）`;

    const wb = worstBin(n);
    $("#chartTitle").textContent = `最悪ケースの比較回数（n = ${fmt(n)}）`;
    $("#barLin").style.transform = `scaleX(1)`;
    $("#barBin").style.transform = `scaleX(${Math.max(wb / n, 0.004)})`;
    $("#barLinT").textContent = `リニアサーチ ${fmt(n)} 回（n に比例）`;
    $("#barBinT").textContent = `二分探索 ${fmt(wb)} 回（n が 2 倍でも +1 回）`;
  }

  // 各ビートは (n, t) から見た目とキャプションを決める
  const ON = ["lin", "bin", "legend"];
  const beats = [
    { on: ON, s: () => [0, 0], cap: () => `同じ整列済み配列（${fmt(n)} 個）から値 ${fmt(val(t))} を探す。比較はまだ 0 回。` },
    { on: ON, s: () => [1, 1], cap: () => `1 回目。リニアは先頭と比べて候補が 1 個減る。二分探索は中央と比べ、大小で片側を丸ごと捨てる。` },
    { on: ON, s: () => [3, 3], cap: () => `3 回目まで。リニアの候補は ${fmt(Math.max(n - Math.min(3, L), 0))} 個、二分探索の候補は約 1/8 まで減る。` },
    { on: ON, s: () => [K, K], cap: () => K <= L ? `二分探索は ${fmt(K)} 回で発見。同じ回数でリニアはまだ ${fmt(K)} 個しか見ていない。` : `今回は先頭付近なので、リニアが ${fmt(L)} 回で先に見つける。二分探索は ${fmt(K)} 回。` },
    { on: ON, s: () => [L, K], cap: () => `リニアは ${fmt(L)} 回で発見。二分探索の ${fmt(K)} 回と比べて ${L >= K ? fmt(Math.round(L / K * 10) / 10) + " 倍" : "少ない（先頭付近の場合だけ）"}。` },
    { on: [...ON, "chart"], ms: 6000, s: () => [L, K], cap: () => `なぜ差が開くのか。整列済みなので、1 回の比較で半分を捨てられる。だから二分探索は最大 ⌊log₂n⌋+1 回（100万個でも 20 回）、リニアは最大 n 回になる。n を動かして確かめてください。` },
  ].map(b => Object.defineProperty(b, "caption", { get: b.cap }));

  // 1 回ずつ: −1 / +1 で両方の探索を 1 比較ずつ進める（再生は止める）。次にビートが変わると解除
  let cur = 0, manual = null;
  function render(b, i) { cur = i; manual = null; draw(...b.s()); }
  function stepCap(s) {
    if (s === 0) return "まだ比べていない。+1 で 1 回ずつ進める。";
    const lin = s < L ? `リニアは ${fmt(s)} 番目（値 ${fmt(val(s - 1))}）と比べて違った` : s === L ? `リニアは ${fmt(L)} 番目で発見` : `リニアは ${fmt(L)} 回で発見済み`;
    if (s > K) return `${lin}。二分探索は ${fmt(K)} 回で発見済み。`;
    const st = S[s - 1];
    return `${lin}。` + (st.found ? `二分探索は ${fmt(st.m + 1)} 番目で発見。`
      : `二分探索は ${fmt(st.m + 1)} 番目（値 ${fmt(val(st.m))}）と比べ、${st.m < t ? "小さいので左側" : "大きいので右側"}を捨てる（残り ${fmt(st.hi - st.lo + 1)} 個）。`);
  }
  function setManual(s) {
    if ($("#play").getAttribute("aria-label") === "一時停止") $("#play").click();
    manual = Math.max(0, Math.min(s, Math.max(K, L)));
    draw(manual, manual);
    $("#caption").textContent = `比較 ${fmt(manual)} 回目　${stepCap(manual)}`;
  }
  const shown = () => manual ?? Math.max(...beats[cur].s());
  $("#minus").onclick = () => setManual(shown() - 1);
  $("#plus").onclick = () => setManual(shown() + 1);
  // 値を変えたら、いま見ているビート（または 1 回ずつの位置）をその値で描き直す
  for (const id of ["#n", "#t"]) $(id).oninput = () => {
    readInputs();
    if (manual !== null) return setManual(manual);
    render(beats[cur], cur);
    $("#caption").textContent = `${cur + 1}/${beats.length}　${beats[cur].caption}`;
  };
  readInputs();
</script>

<script>
  /* dpgk-player:start v14 */
  (() => {
    const $ = s => document.querySelector(s);
    const BEAT = typeof BEAT_MS === "number" ? BEAT_MS : 2600;
    const MOVE_MS = 600;   // 1× のときの遷移の長さ（CSS の --dur の基準）
    const draw = typeof render === "function" ? render : () => {};
    const els = [...document.querySelectorAll("[data-k]")];
    const dots = $("#dots");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let i = 0, timer = null, rate = 1;
    let spent = 0, segStart = 0;   // 今のビートで消化した長さ（1× 換算 ms）と、いまの区間の開始時刻

    // 図の向き: #scene に data-viewbox-portrait があるときだけ、図が大きく映る方に切り替える
    const scene = $("#scene");
    const vbLandscape = scene.getAttribute("viewBox"), vbPortrait = scene.dataset.viewboxPortrait;
    function orient() {
      // 図が大きく映る方を選ぶ（ステージに viewBox を収めたときの倍率で比べる）
      const st = $("#stage"), w = st.clientWidth, h = st.clientHeight - $("#caption").offsetHeight;
      const fit = vb => { const [, , vw, vh] = vb.split(/[\s,]+/).map(Number); return Math.min(w / vw, h / vh); };
      const o = vbPortrait && fit(vbPortrait) > fit(vbLandscape) ? "portrait" : "landscape";
      if (document.documentElement.dataset.orient === o) return false;
      document.documentElement.dataset.orient = o;
      scene.setAttribute("viewBox", o === "portrait" ? vbPortrait : vbLandscape);
      return true;
    }
    orient();
    new ResizeObserver(() => { if (orient()) go(i); }).observe($("#stage"));

    function go(n) {
      i = (n + beats.length) % beats.length;
      spent = 0;
      const b = beats[i];
      for (const el of els) {
        const k = el.dataset.k;
        if (b.on) el.classList.toggle("off", !b.on.includes(k));
        el.classList.toggle("dim", !!b.focus && (!b.on || b.on.includes(k)) && !b.focus.includes(k));
      }
      draw(b, i);
      $("#caption").textContent = `${i + 1}/${beats.length}　${b.caption}`;
      [...dots.children].forEach((d, n) => n === i ? d.setAttribute("aria-current", "step") : d.removeAttribute("aria-current"));
    }
    // 再生バー: 終わったビートの長さ + 今のビートで進んだ分 を全体の長さで割る（ビートごとの長さの違いも反映）
    // #feed=story / #feed=scroll で iframe の中に開かれたとき（dpgk-feed など）は、最後まで再生したらループせず親に知らせ、
    // 進み具合と「次へ / 前へ」の操作も親に送る。story は左右、scroll は上下が記事の移動になる
    const FEED = /feed/.test(location.hash) && parent !== window;
    const FEED_MODE = FEED ? ((location.hash.match(/feed=(story|scroll)/) || [])[1] || "story") : "";
    if (FEED_MODE) document.documentElement.dataset.feed = FEED_MODE;
    const nav = dir => parent.postMessage({ dpgk: "nav", dir }, "*");
    const lens = beats.map(b => b.ms || BEAT), total = lens.reduce((a, b) => a + b, 0);
    let sent = -1;
    (function bar() {
      const now = Math.min(lens[i], spent + (timer ? (performance.now() - segStart) * rate : 0));
      const done = lens.slice(0, i).reduce((a, b) => a + b, 0) + now;
      $("#progress").style.transform = `scaleX(${done / total})`;
      if (FEED && Math.abs(done / total - sent) > 0.004) parent.postMessage({ dpgk: "progress", value: sent = done / total }, "*");
      requestAnimationFrame(bar);
    })();
    function badge(text) { $("#badge").textContent = text; $("#badge").classList.toggle("show", !!text); }
    // ビートの残り時間を、いまの速度で数える。速度を変えても一時停止しても、それまでに進んだ分は失わない
    function tick() {
      segStart = performance.now();
      timer = setTimeout(() => {
        if (FEED && i === beats.length - 1) { timer = null; spent = lens[i]; parent.postMessage({ dpgk: "ended" }, "*"); return; }
        go(i + 1); tick();
      }, Math.max(0, (beats[i].ms || BEAT) - spent) / rate);
    }
    function pauseClock() { if (timer) { spent += (performance.now() - segStart) * rate; clearTimeout(timer); timer = null; } }
    function play() { $("#play").textContent = "一時停止"; $("#play").setAttribute("aria-label", "一時停止"); badge(""); tick(); }
    function stop() { pauseClock(); $("#play").textContent = "再生"; $("#play").setAttribute("aria-label", "再生"); badge("一時停止中"); }

    // 倍速: ビートの間隔と遷移の両方を縮める。再生中ならすぐ新しい速度で数え直す
    const RATES = [...$("#speed").options].map(o => Number(o.value));
    function setRate(r) {
      const playing = !!timer;
      pauseClock();
      rate = r;
      if (RATES.includes(r)) $("#speed").value = String(r);
      if (!reduced) document.documentElement.style.setProperty("--dur", `${MOVE_MS / rate}ms`);
      if (playing) tick();
    }
    $("#speed").onchange = e => setRate(Number(e.target.value));

    beats.forEach((_, n) => {
      const b = document.createElement("button");
      b.setAttribute("aria-label", `ステップ ${n + 1}`);
      b.onclick = () => { stop(); go(n); };
      dots.append(b);
    });

    // 縦型動画と同じ操作: タップ = 一時停止/再開、長押し（300ms 以上）= 押している間だけ 2×。
    // 押したままドラッグすると速度を変えられる（速く: 最大 10×、遅く: 最小 0.1×）。ドラッグの向きは表示のしかたで変わる:
    //   ふつう / #feed=story … 上下（上で速く）。story では左右のスワイプと、左右の端のタップが記事の移動
    //   #feed=scroll … 左右（右で速く）。上下のスワイプが記事の移動（上で次へ）
    // 引き始めはゆっくり、引くほど急に変わる: 距離の CURVE 乗で効かせ、RANGE_PX 引くと上限 / 下限に届く
    const HOLD_MS = 300, DRAG_PX = 10, SWIPE_PX = 40, EDGE = 0.28, RANGE_PX = 220, CURVE = 2.2, BASE_RATE = 2, MIN_RATE = 0.1, MAX_RATE = 10;
    const AXIS = FEED_MODE === "scroll" ? "x" : "y";   // 速度を変えるドラッグの向き
    let holdTimer = null, pressed = false, holding = false, swiped = false, rateBeforeHold = 1, pausedBeforeHold = false;
    let downX = 0, downY = 0, holdPos = 0;
    const stage = $("#stage");
    const fmt = r => (r >= 1 ? r.toFixed(r < 10 ? 1 : 0) : r.toFixed(1)).replace(/\.0$/, "");
    function startHold(pos) {
      clearTimeout(holdTimer);
      holding = true;
      holdPos = pos;
      rateBeforeHold = rate;
      pausedBeforeHold = !timer;
      if (pausedBeforeHold) play();
      setRate(2);
      badge(`2× ▶▶　${AXIS === "x" ? "左右" : "上下"}にドラッグで速度`);
    }
    stage.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      pressed = true;
      try { stage.setPointerCapture(e.pointerId); } catch {}   // 図の外まで動かしても追えるように
      downX = e.clientX; downY = e.clientY; swiped = false;
      holdTimer = setTimeout(() => startHold(AXIS === "x" ? e.clientX : e.clientY), HOLD_MS);
    });
    stage.addEventListener("pointermove", e => {
      if (!pressed || swiped) return;
      const dx = e.clientX - downX, dy = e.clientY - downY;
      if (!holding) {
        // 記事の移動（スワイプ）: story は左右、scroll は上下。長押しが始まる前の素早い動きだけを数える
        const navDelta = FEED_MODE === "story" ? dx : FEED_MODE === "scroll" ? dy : 0;
        const other = FEED_MODE === "story" ? dy : dx;
        if (FEED_MODE && Math.abs(navDelta) > SWIPE_PX && Math.abs(navDelta) > Math.abs(other)) {
          swiped = true; clearTimeout(holdTimer); nav(navDelta < 0 ? 1 : -1); return;
        }
        const along = AXIS === "x" ? dx : dy;
        if (Math.abs(along) > DRAG_PX && Math.abs(along) > Math.abs(AXIS === "x" ? dy : dx)) startHold(AXIS === "x" ? downX : downY);   // すぐ動かしたら長押しを待たずに速度変更へ
        else return;
      }
      const moved = AXIS === "x" ? e.clientX - holdPos : holdPos - e.clientY;   // 右 / 上が速い
      const d = Math.max(-1, Math.min(1, moved / RANGE_PX));   // -1〜1
      const k = Math.abs(d) ** CURVE;
      const r = d >= 0 ? BASE_RATE * (MAX_RATE / BASE_RATE) ** k : BASE_RATE * (MIN_RATE / BASE_RATE) ** k;
      const rounded = r < 3 ? Math.round(r * 10) / 10 : Math.round(r * 2) / 2;   // 3× 以上は 0.5 刻み
      if (rounded !== rate) { setRate(rounded); badge(`${fmt(rounded)}× ${rounded >= 1 ? "▶▶" : "▶"}`); }
    });
    function release(isTap) {
      if (!pressed) return;
      pressed = false;
      clearTimeout(holdTimer);
      if (holding) { holding = false; setRate(rateBeforeHold); badge(""); if (pausedBeforeHold) stop(); }
      else if (isTap && !swiped) {
        // story では左右の端のタップで記事を移動し、真ん中のタップで一時停止する
        const x = (downX - stage.getBoundingClientRect().left) / stage.clientWidth;
        if (FEED_MODE === "story" && x < EDGE) nav(-1);
        else if (FEED_MODE === "story" && x > 1 - EDGE) nav(1);
        else timer ? stop() : play();
      }
    }
    // scroll では、ホイール（トラックパッド）の上下も記事の移動にする
    let wheelAt = 0;
    if (FEED_MODE === "scroll") addEventListener("wheel", e => {
      if (Math.abs(e.deltaY) < 20 || performance.now() - wheelAt < 700) return;
      wheelAt = performance.now(); nav(e.deltaY > 0 ? 1 : -1);
    }, { passive: true });
    stage.addEventListener("pointerup", () => release(true));
    stage.addEventListener("pointercancel", () => release(false));
    stage.addEventListener("lostpointercapture", () => release(false));
    stage.addEventListener("contextmenu", e => e.preventDefault());

    // 配色: 自動（OS に従う）→ ライト → ダーク の順に切り替え、選んだものを覚えておく
    const THEMES = ["auto", "light", "dark"], THEME_LABEL = { auto: "自動", light: "ライト", dark: "ダーク" };
    function setTheme(t) {
      if (t === "auto") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.dataset.theme = t;
      $("#theme").textContent = THEME_LABEL[t];
      try { localStorage.setItem("dpgk-theme", t); } catch {}
    }
    let theme = "auto";
    try { theme = THEMES.includes(localStorage.getItem("dpgk-theme")) ? localStorage.getItem("dpgk-theme") : "auto"; } catch {}
    setTheme(theme);
    $("#theme").onclick = () => setTheme(theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]);

    // 全画面（対応ブラウザのみボタンを出す）。F キーでも切り替え
    const fs = $("#fs");
    const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (document.fullscreenEnabled) { fs.hidden = false; fs.onclick = toggleFs; }
    addEventListener("fullscreenchange", () => { fs.textContent = document.fullscreenElement ? "全画面を終了" : "全画面"; });

    $("#prev").onclick = () => { stop(); go(i - 1); };
    $("#next").onclick = () => { stop(); go(i + 1); };
    $("#play").onclick = () => (timer ? stop() : play());
    addEventListener("keydown", e => {
      if (e.target.closest("input, select, textarea")) return;
      if (e.key === "ArrowLeft") $("#prev").click();
      else if (e.key === "ArrowRight") $("#next").click();
      else if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); $("#play").click(); }
      else if ((e.key === "f" || e.key === "F") && document.fullscreenEnabled) toggleFs();
      // YouTube と同じ < > で速度を下げる・上げる
      else if (e.key === ">" || e.key === "<") {
        const n = RATES.indexOf(rate) + (e.key === ">" ? 1 : -1);
        setRate(RATES[Math.max(0, Math.min(RATES.length - 1, n))]);
      }
    });

    // #beat=3 で 3 番目のビートを遷移なしで表示する（共有リンクと dpgk_snap.py 用）
    const fromHash = () => Number((location.hash.match(/beat=(\d+)/) || [])[1]);
    // #beat=N&measure: 図の中で一番小さい文字が画面上で何 px になるかを親フレームに知らせる（dpgk_snap.py --measure 用）
    if (/measure/.test(location.hash)) setTimeout(() => {
      let min = Infinity, label = "";
      for (const t of document.querySelectorAll("#scene text")) {
        const m = t.getScreenCTM();
        if (!m || !t.textContent.trim() || t.closest(".off") || getComputedStyle(t).visibility === "hidden") continue;
        const px = parseFloat(getComputedStyle(t).fontSize) * Math.hypot(m.a, m.b);
        if (px < min) { min = px; label = t.textContent.trim().slice(0, 20); }
      }
      parent.postMessage({ dpgk: "measure", beat: i + 1, total: beats.length, orient: document.documentElement.dataset.orient, minFont: Math.round(min * 10) / 10, label }, "*");
    }, 300);
    addEventListener("hashchange", () => { stop(); go(fromHash() - 1); });
    if (fromHash()) {
      document.documentElement.style.setProperty("--dur", "0ms");
      go(fromHash() - 1);
    } else if (reduced) {
      go(beats.length - 1);   // 動きを減らす設定では、自動再生せず最終状態を見せる
      if (FEED) setTimeout(() => parent.postMessage({ dpgk: "ended" }, "*"), 8000);
    } else {
      go(0);
      play();
    }
  })();
  /* dpgk-player:end */
</script>
</body>
</html>
