<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git merge と rebase の違い</title>
<!--
  dpgk HTML プレイヤーのひな形。
  書き換えるのは「図のスタイル」「header」「#scene の SVG」「図のスクリプト（beats と render）」だけ。
  dpgk-player:start〜end で囲まれた 3 ブロック（CSS / 操作ボタン / プレイヤーのスクリプト）は編集しない。
  scripts/dpgk_sync_player.py がこのひな形の最新版で上書きする。
-->
<style>
  /* dpgk-player:start v15 */
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #d6d3d1;
    --node: #ffffff; --accent: #2563eb; --bad: #dc2626; --good: #16a34a;
    --dur: 600ms;
  }
  /* ダーク配色: OS の設定に従う（自動）か、表示ボタンで選んだもの（html の data-theme）に従う */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --node: #292524; --accent: #60a5fa; --bad: #f87171; --good: #4ade80; }
  }
  :root[data-theme="dark"] { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --node: #292524; --accent: #60a5fa; --bad: #f87171; --good: #4ade80; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  /* 画面全体を使う: 見出しと操作は最小限、残りの高さはすべて図に渡す */
  main { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; }
  header { flex: none; }
  h1 { font-size: 1.15rem; margin: 0; }
  .q { color: var(--muted); margin: 0; font-size: .95rem; }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .stage > svg { flex: 1; min-height: 0; width: 100%; height: 100%; display: block; }
  .badge { position: absolute; top: 8px; right: 8px; padding: 2px 10px; border-radius: 999px; background: var(--fg); color: var(--bg); font-size: .85rem; font-weight: 700; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 1; }
  .badge.show { opacity: .85; }
  .caption { flex: none; min-height: 3.2em; margin: 4px 0 0; font-size: clamp(1rem, 2.2vw, 1.35rem); }
  [data-k] { transition: opacity var(--dur) ease-out, transform var(--dur) ease-in-out; }
  /* 出し入れはプレイヤーの役目なので、図のスタイル側の opacity より必ず勝たせる */
  [data-k].off { opacity: 0 !important; }
  [data-k].dim { opacity: .25 !important; }
  .controls { flex: none; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--node); color: var(--fg); cursor: pointer; }
  .controls button:focus-visible, .controls select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .speed { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: .9rem; }
  .controls select { font: inherit; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--node); color: var(--fg); }
  .dots { display: flex; gap: 6px; margin-left: auto; }
  .dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; }
  .dots button[aria-current="step"] { background: var(--accent); border-color: var(--accent); }
  #fs[hidden] { display: none; }
  [data-feed="story"] .progress { display: none; }
  /* 再生バー: 画面の上辺に、全体のどこまで進んだかだけを示す（時間表示なし） */
  .progress { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: var(--line); z-index: 10; pointer-events: none; }
  .progress > i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
  /* 縦長の画面では縦向きの図に切り替える（#scene に data-viewbox-portrait があるときだけ） */
  [data-orient="portrait"] .only-landscape, [data-orient="landscape"] .only-portrait { display: none; }
  /* スマホ: 見出し・説明・操作を詰めて、図に高さを渡す。速度はジェスチャー（長押し・ドラッグ）で変えられるので選択欄は隠す */
  @media (max-width: 480px) {
    main { padding: 8px 12px; gap: 4px; }
    h1 { font-size: 1rem; }
    .q { font-size: .82rem; line-height: 1.4; }
    .caption { font-size: .95rem; line-height: 1.45; min-height: 2.9em; }
    .controls { flex-wrap: nowrap; gap: 6px; }
    .controls button { padding: 4px 10px; }
    .speed, #fs { display: none; }
    .dots { gap: 4px; }
    .controls .dots button { width: 10px; height: 10px; padding: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --dur: 0ms; }
  }
  /* dpgk-player:end */

  /* ここから図のスタイル（自由に書き換える） */
  :root { --edge: #a8a29e; --new: #ea580c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --edge: #78716c; --new: #fb923c; } }
  :root[data-theme="dark"] { --edge: #78716c; --new: #fb923c; }
  svg text { fill: var(--fg); font-size: 15px; }
  .hd { font-weight: 700; font-size: 16px; }
  .hd tspan { fill: var(--muted); font-weight: 400; }
  .sep { stroke: var(--line); stroke-width: 1; }
  .e { stroke: var(--edge); stroke-width: 2.5; fill: none; }
  .e.new { stroke: var(--new); }
  .c circle { stroke-width: 2.5; }
  .c.m circle { fill: var(--node); stroke: var(--fg); }
  .c.f circle { fill: var(--accent); stroke: var(--accent); }
  .c.n circle { fill: var(--new); stroke: var(--new); }
  .c.f text, .c.n text { fill: #fff; }
  .c text { font-weight: 700; text-anchor: middle; }
  .tag rect { fill: var(--fg); }
  .tag text { fill: var(--bg); font-size: 13px; font-weight: 700; text-anchor: middle; }
  .note { fill: var(--muted); font-size: 13px; }
  .sum { font-weight: 700; }
  .legend text { font-size: 14px; fill: var(--muted); }
  .legend circle { stroke-width: 2; }
  /* ブランチ名の移動は、コミットが出たあとに動かす（因果） */
  .late { transition-delay: var(--dur); }
  /* 新しいコミットは小さい状態から出す（出現をキレよく見せる。止めれば最終状態と同じ） */
  .pop { transform-box: fill-box; transform-origin: center; transition: transform var(--dur) cubic-bezier(.2, 1.5, .4, 1); }
  .off .pop { transform: scale(.4); }
  /* 横向き: 凡例は図の右。縦向き: 上下の間をあけ、凡例は図の下へ。図が縮むぶん文字を大きくする */
  .legend { transform: translate(560px, 180px); }
  [data-orient="portrait"] .legend { transform: translate(60px, 570px); }
  [data-orient="portrait"] .sep { transform: translate(0, 30px); }
  [data-orient="portrait"] .pr { transform: translate(0, 60px); }
  [data-orient="portrait"] svg text, [data-orient="portrait"] .hd { font-size: 21px; }
  [data-orient="portrait"] .tag text { font-size: 16px; }
  [data-orient="portrait"] .note, [data-orient="portrait"] .legend text { font-size: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>git merge と git rebase の違い</h1>
    <p class="q">問い: 同じ2本のブランチをまとめるとき、merge と rebase で履歴の形はどう変わるのか</p>
  </header>

  <!-- 縦型動画と同じ操作: タップで一時停止/再開、長押ししている間だけ 2×。#stage / #badge / #caption は必須 -->
  <div class="stage" id="stage">
    <div class="badge" id="badge" aria-hidden="true"></div>
    <svg id="scene" viewBox="10 0 790 440" data-viewbox-portrait="40 0 480 670" role="img" aria-labelledby="scene-title">
      <title id="scene-title">上段は merge で merge コミット M を足し枝分かれが残る。下段は rebase で D と E を C の上に D′ と E′ として作り直し、履歴が直線になる。</title>

      <!-- 上段: merge -->
      <text class="hd" x="50" y="28">merge<tspan> ― main 上で git merge feature</tspan></text>
      <g data-k="mbase">
        <path class="e" d="M70,90 L270,90"/>
        <path class="e" d="M170,90 L270,150 L370,150"/>
        <g class="c m"><circle cx="70" cy="90" r="18"/><text x="70" y="95">A</text></g>
        <g class="c m"><circle cx="170" cy="90" r="18"/><text x="170" y="95">B</text></g>
        <g class="c m"><circle cx="270" cy="90" r="18"/><text x="270" y="95">C</text></g>
        <g class="c f"><circle cx="270" cy="150" r="18"/><text x="270" y="155">D</text></g>
        <g class="c f"><circle cx="370" cy="150" r="18"/><text x="370" y="155">E</text></g>
      </g>
      <path class="e new" data-k="mMedge" d="M288,90 L452,90 M385,141 L455,99"/>
      <g data-k="mM"><g class="pop c n"><circle cx="470" cy="90" r="18"/><text x="470" y="95">M</text></g></g>
      <g class="tag" data-k="mftag"><rect x="406" y="139" width="76" height="22" rx="4"/><text x="444" y="155">feature</text></g>
      <g class="tag late" data-k="mtag"><rect x="-28" y="-11" width="56" height="22" rx="4"/><text x="0" y="5">main</text></g>
      <text class="sum" data-k="msum" x="280" y="196" text-anchor="middle">既存のコミットは不変。枝分かれの形が残る</text>

      <line class="sep" x1="10" y1="216" x2="530" y2="216"/>

      <!-- 下段: rebase（縦向きでは .pr ごと下へずらす） -->
      <g class="pr">
        <text class="hd" x="50" y="248">rebase<tspan> ― feature 上で git rebase main</tspan></text>
        <g data-k="rbase">
          <path class="e" d="M70,300 L270,300"/>
          <g class="c m"><circle cx="70" cy="300" r="18"/><text x="70" y="305">A</text></g>
          <g class="c m"><circle cx="170" cy="300" r="18"/><text x="170" y="305">B</text></g>
          <g class="c m"><circle cx="270" cy="300" r="18"/><text x="270" y="305">C</text></g>
        </g>
        <g data-k="rold">
          <path class="e" d="M185,309 L255,351 M288,360 L352,360"/>
          <g class="c f"><circle cx="270" cy="360" r="18"/><text x="270" y="365">D</text></g>
          <g class="c f"><circle cx="370" cy="360" r="18"/><text x="370" y="365">E</text></g>
        </g>
        <text class="note" data-k="rnote" x="320" y="402" text-anchor="middle">元の D・E: どのブランチからも辿れない</text>
        <path class="e new" data-k="redge1" d="M288,300 L352,300"/>
        <path class="e new" data-k="redge2" d="M388,300 L452,300"/>
        <g data-k="rD2"><g class="pop c n"><circle cx="0" cy="0" r="18"/><text x="0" y="5">D′</text></g></g>
        <g data-k="rE2"><g class="pop c n"><circle cx="0" cy="0" r="18"/><text x="0" y="5">E′</text></g></g>
        <g class="tag" data-k="rmtag"><rect x="242" y="255" width="56" height="22" rx="4"/><text x="270" y="271">main</text></g>
        <g class="tag late" data-k="rftag"><rect x="-38" y="-11" width="76" height="22" rx="4"/><text x="0" y="5">feature</text></g>
        <text class="sum" data-k="rsum" x="280" y="434" text-anchor="middle">D・E は作り直し。履歴は1本の直線</text>
      </g>

      <!-- 凡例（横向きは右、縦向きは下） -->
      <g class="legend">
        <g class="c m"><circle cx="0" cy="0" r="8"/></g><text x="18" y="5">main のコミット</text>
        <g class="c f"><circle cx="0" cy="32" r="8"/></g><text x="18" y="37">feature のコミット</text>
        <g class="c n"><circle cx="0" cy="64" r="8"/></g><text x="18" y="69">操作で新しくできたコミット</text>
      </g>
    </svg>
    <p class="caption" id="caption" aria-live="polite"></p>
  </div>

  <!-- dpgk-player:start v15 -->
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  <div class="controls">
    <button id="prev" aria-label="前のステップ">←</button>
    <button id="play" aria-label="再生">再生</button>
    <button id="next" aria-label="次のステップ">→</button>
    <label class="speed">速度
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </label>
    <button id="theme" aria-label="配色の切り替え（自動 / ライト / ダーク）">自動</button>
    <button id="fs" aria-label="全画面表示" hidden>全画面</button>
    <div class="dots" id="dots"></div>
  </div>
  <!-- dpgk-player:end -->
</main>

<script>
  // ここから図のスクリプト（自由に書き換える）
  // beats: 各ビートの最終状態。on: 表示する data-k / focus: 強調する data-k（他は薄くする）/ ms: このビートの長さ（省略時 BEAT_MS）
  // render(b, i): ブランチ名と作り直したコミットの位置をビート番号から決める
  const BEAT_MS = 4200;   // 1× のときの 1 ビートの長さ

  // 動く要素: ビート番号 at 以降は to、それより前は from に置く（座標は各段の中の座標なので、縦横どちらの向きでも同じ）
  const moves = {
    mtag:  { from: [270, 56],  to: [470, 56],  at: 1 },
    rD2:   { from: [270, 360], to: [370, 300], at: 2 },
    rE2:   { from: [370, 360], to: [470, 300], at: 3 },
    rftag: { from: [444, 360], to: [470, 266], at: 4 },
  };

  const BASE = ["mbase", "mftag", "mtag", "rbase", "rold", "rmtag", "rftag"];
  const MERGE = ["mbase", "mftag", "mtag", "mM", "mMedge"];
  const REB = ["rbase", "rmtag", "rftag", "rD2", "rE2", "redge1", "redge2"];
  const beats = [
    { caption: "出発点は上下とも同じ。main は C まで進み、feature は B から分かれて D・E を積んでいる。",
      on: BASE },
    { caption: "merge では、C と E の2つを親に持つ merge コミット M を1つ足し、main が M へ進む。D・E は元のまま残る。",
      on: [...BASE, "mM", "mMedge"], focus: MERGE },
    { caption: "rebase では、feature のコミットを main の先端 C の上で1つずつ作り直す。まず D を D′ として作り直す。",
      on: [...BASE, "rD2", "redge1"], focus: [...REB, "rold"] },
    { caption: "続けて E を E′ として作り直す。変更内容は同じでも親が違うので、D・E とは別のコミットになり、ID も変わる。",
      on: [...BASE, "rD2", "redge1", "rE2", "redge2"], focus: [...REB, "rold"], ms: 5000 },
    { caption: "feature が E′ を指す。元の D・E はどのブランチからも辿れなくなり、履歴は1本の直線になる。",
      on: [...BASE, "rD2", "redge1", "rE2", "redge2", "rnote"], focus: [...REB, "rnote"] },
    { caption: "なぜ使い分けるのか。merge は既存のコミットを変えないので、共有済みのブランチでも安全に使える。rebase は履歴が読みやすくなるが、コミットを作り直すので、他の人が D・E を取得済みのブランチでは使わない。",
      on: [...BASE, "mM", "mMedge", "rD2", "redge1", "rE2", "redge2", "rnote", "msum", "rsum"],
      focus: [...MERGE, ...REB, "rnote", "msum", "rsum"], ms: 7000 },
  ];
  function render(b, i) {
    for (const [k, m] of Object.entries(moves)) {
      const [x, y] = i >= m.at ? m.to : m.from;
      document.querySelector(`[data-k="${k}"]`).style.transform = `translate(${x}px, ${y}px)`;
    }
  }
</script>

<script>
  /* dpgk-player:start v15 */
  (() => {
    const $ = s => document.querySelector(s);
    const BEAT = typeof BEAT_MS === "number" ? BEAT_MS : 2600;
    const MOVE_MS = 600;   // 1× のときの遷移の長さ（CSS の --dur の基準）
    const draw = typeof render === "function" ? render : () => {};
    const els = [...document.querySelectorAll("[data-k]")];
    const dots = $("#dots");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let i = 0, timer = null, rate = 1;
    let spent = 0, segStart = 0;   // 今のビートで消化した長さ（1× 換算 ms）と、いまの区間の開始時刻

    // 図の向き: #scene に data-viewbox-portrait があるときだけ、図が大きく映る方に切り替える
    const scene = $("#scene");
    const vbLandscape = scene.getAttribute("viewBox"), vbPortrait = scene.dataset.viewboxPortrait;
    function orient() {
      // 図が大きく映る方を選ぶ（ステージに viewBox を収めたときの倍率で比べる）
      const st = $("#stage"), w = st.clientWidth, h = st.clientHeight - $("#caption").offsetHeight;
      const fit = vb => { const [, , vw, vh] = vb.split(/[\s,]+/).map(Number); return Math.min(w / vw, h / vh); };
      const o = vbPortrait && fit(vbPortrait) > fit(vbLandscape) ? "portrait" : "landscape";
      if (document.documentElement.dataset.orient === o) return false;
      document.documentElement.dataset.orient = o;
      scene.setAttribute("viewBox", o === "portrait" ? vbPortrait : vbLandscape);
      return true;
    }
    orient();
    new ResizeObserver(() => { if (orient()) go(i); }).observe($("#stage"));

    function go(n) {
      i = (n + beats.length) % beats.length;
      spent = 0;
      const b = beats[i];
      for (const el of els) {
        const k = el.dataset.k;
        if (b.on) el.classList.toggle("off", !b.on.includes(k));
        el.classList.toggle("dim", !!b.focus && (!b.on || b.on.includes(k)) && !b.focus.includes(k));
      }
      draw(b, i);
      $("#caption").textContent = `${i + 1}/${beats.length}　${b.caption}`;
      [...dots.children].forEach((d, n) => n === i ? d.setAttribute("aria-current", "step") : d.removeAttribute("aria-current"));
    }
    // 再生バー: 終わったビートの長さ + 今のビートで進んだ分 を全体の長さで割る（ビートごとの長さの違いも反映）
    // #feed=story / #feed=scroll（または iframe の name="dpgk-feed=story" など）で iframe の中に開かれたとき（dpgk-feed など）は、最後まで再生したらループせず親に知らせ、
    // 進み具合と「次へ / 前へ」の操作も親に送る。story は左右、scroll は上下が記事の移動になる
    // 指定は URL の #feed=… か、iframe の name 属性（srcdoc で埋め込むときは URL に # を付けられないため）
    const FEED_HINT = `${location.hash} ${window.name}`;
    const FEED = /feed/.test(FEED_HINT) && parent !== window;
    const FEED_MODE = FEED ? ((FEED_HINT.match(/feed=(story|scroll)/) || [])[1] || "story") : "";
    if (FEED_MODE) document.documentElement.dataset.feed = FEED_MODE;
    const nav = dir => parent.postMessage({ dpgk: "nav", dir }, "*");
    const lens = beats.map(b => b.ms || BEAT), total = lens.reduce((a, b) => a + b, 0);
    let sent = -1;
    (function bar() {
      const now = Math.min(lens[i], spent + (timer ? (performance.now() - segStart) * rate : 0));
      const done = lens.slice(0, i).reduce((a, b) => a + b, 0) + now;
      $("#progress").style.transform = `scaleX(${done / total})`;
      if (FEED && Math.abs(done / total - sent) > 0.004) parent.postMessage({ dpgk: "progress", value: sent = done / total }, "*");
      requestAnimationFrame(bar);
    })();
    function badge(text) { $("#badge").textContent = text; $("#badge").classList.toggle("show", !!text); }
    // ビートの残り時間を、いまの速度で数える。速度を変えても一時停止しても、それまでに進んだ分は失わない
    function tick() {
      segStart = performance.now();
      timer = setTimeout(() => {
        if (FEED && i === beats.length - 1) { timer = null; spent = lens[i]; parent.postMessage({ dpgk: "ended" }, "*"); return; }
        go(i + 1); tick();
      }, Math.max(0, (beats[i].ms || BEAT) - spent) / rate);
    }
    function pauseClock() { if (timer) { spent += (performance.now() - segStart) * rate; clearTimeout(timer); timer = null; } }
    function play() { $("#play").textContent = "一時停止"; $("#play").setAttribute("aria-label", "一時停止"); badge(""); tick(); }
    function stop() { pauseClock(); $("#play").textContent = "再生"; $("#play").setAttribute("aria-label", "再生"); badge("一時停止中"); }

    // 倍速: ビートの間隔と遷移の両方を縮める。再生中ならすぐ新しい速度で数え直す
    const RATES = [...$("#speed").options].map(o => Number(o.value));
    function setRate(r) {
      const playing = !!timer;
      pauseClock();
      rate = r;
      if (RATES.includes(r)) $("#speed").value = String(r);
      if (!reduced) document.documentElement.style.setProperty("--dur", `${MOVE_MS / rate}ms`);
      if (playing) tick();
    }
    $("#speed").onchange = e => setRate(Number(e.target.value));

    beats.forEach((_, n) => {
      const b = document.createElement("button");
      b.setAttribute("aria-label", `ステップ ${n + 1}`);
      b.onclick = () => { stop(); go(n); };
      dots.append(b);
    });

    // 縦型動画と同じ操作: タップ = 一時停止/再開、長押し（300ms 以上）= 押している間だけ 2×。
    // 押したままドラッグすると速度を変えられる（速く: 最大 10×、遅く: 最小 0.1×）。ドラッグの向きは表示のしかたで変わる:
    //   ふつう / #feed=story … 上下（上で速く）。story では左右のスワイプと、左右の端のタップが記事の移動
    //   #feed=scroll … 左右（右で速く）。上下のスワイプが記事の移動（上で次へ）
    // 引き始めはゆっくり、引くほど急に変わる: 距離の CURVE 乗で効かせ、RANGE_PX 引くと上限 / 下限に届く
    const HOLD_MS = 300, DRAG_PX = 10, SWIPE_PX = 40, EDGE = 0.28, RANGE_PX = 220, CURVE = 2.2, BASE_RATE = 2, MIN_RATE = 0.1, MAX_RATE = 10;
    const AXIS = FEED_MODE === "scroll" ? "x" : "y";   // 速度を変えるドラッグの向き
    let holdTimer = null, pressed = false, holding = false, swiped = false, rateBeforeHold = 1, pausedBeforeHold = false;
    let downX = 0, downY = 0, holdPos = 0;
    const stage = $("#stage");
    const fmt = r => (r >= 1 ? r.toFixed(r < 10 ? 1 : 0) : r.toFixed(1)).replace(/\.0$/, "");
    function startHold(pos) {
      clearTimeout(holdTimer);
      holding = true;
      holdPos = pos;
      rateBeforeHold = rate;
      pausedBeforeHold = !timer;
      if (pausedBeforeHold) play();
      setRate(2);
      badge(`2× ▶▶　${AXIS === "x" ? "左右" : "上下"}にドラッグで速度`);
    }
    stage.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      pressed = true;
      try { stage.setPointerCapture(e.pointerId); } catch {}   // 図の外まで動かしても追えるように
      downX = e.clientX; downY = e.clientY; swiped = false;
      holdTimer = setTimeout(() => startHold(AXIS === "x" ? e.clientX : e.clientY), HOLD_MS);
    });
    stage.addEventListener("pointermove", e => {
      if (!pressed || swiped) return;
      const dx = e.clientX - downX, dy = e.clientY - downY;
      if (!holding) {
        // 記事の移動（スワイプ）: story は左右、scroll は上下。長押しが始まる前の素早い動きだけを数える
        const navDelta = FEED_MODE === "story" ? dx : FEED_MODE === "scroll" ? dy : 0;
        const other = FEED_MODE === "story" ? dy : dx;
        if (FEED_MODE && Math.abs(navDelta) > SWIPE_PX && Math.abs(navDelta) > Math.abs(other)) {
          swiped = true; clearTimeout(holdTimer); nav(navDelta < 0 ? 1 : -1); return;
        }
        const along = AXIS === "x" ? dx : dy;
        if (Math.abs(along) > DRAG_PX && Math.abs(along) > Math.abs(AXIS === "x" ? dy : dx)) startHold(AXIS === "x" ? downX : downY);   // すぐ動かしたら長押しを待たずに速度変更へ
        else return;
      }
      const moved = AXIS === "x" ? e.clientX - holdPos : holdPos - e.clientY;   // 右 / 上が速い
      const d = Math.max(-1, Math.min(1, moved / RANGE_PX));   // -1〜1
      const k = Math.abs(d) ** CURVE;
      const r = d >= 0 ? BASE_RATE * (MAX_RATE / BASE_RATE) ** k : BASE_RATE * (MIN_RATE / BASE_RATE) ** k;
      const rounded = r < 3 ? Math.round(r * 10) / 10 : Math.round(r * 2) / 2;   // 3× 以上は 0.5 刻み
      if (rounded !== rate) { setRate(rounded); badge(`${fmt(rounded)}× ${rounded >= 1 ? "▶▶" : "▶"}`); }
    });
    function release(isTap) {
      if (!pressed) return;
      pressed = false;
      clearTimeout(holdTimer);
      if (holding) { holding = false; setRate(rateBeforeHold); badge(""); if (pausedBeforeHold) stop(); }
      else if (isTap && !swiped) {
        // story では左右の端のタップで記事を移動し、真ん中のタップで一時停止する
        const x = (downX - stage.getBoundingClientRect().left) / stage.clientWidth;
        if (FEED_MODE === "story" && x < EDGE) nav(-1);
        else if (FEED_MODE === "story" && x > 1 - EDGE) nav(1);
        else timer ? stop() : play();
      }
    }
    // scroll では、ホイール（トラックパッド）の上下も記事の移動にする
    let wheelAt = 0;
    if (FEED_MODE === "scroll") addEventListener("wheel", e => {
      if (Math.abs(e.deltaY) < 20 || performance.now() - wheelAt < 700) return;
      wheelAt = performance.now(); nav(e.deltaY > 0 ? 1 : -1);
    }, { passive: true });
    stage.addEventListener("pointerup", () => release(true));
    stage.addEventListener("pointercancel", () => release(false));
    stage.addEventListener("lostpointercapture", () => release(false));
    stage.addEventListener("contextmenu", e => e.preventDefault());

    // 配色: 自動（OS に従う）→ ライト → ダーク の順に切り替え、選んだものを覚えておく
    const THEMES = ["auto", "light", "dark"], THEME_LABEL = { auto: "自動", light: "ライト", dark: "ダーク" };
    function setTheme(t) {
      if (t === "auto") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.dataset.theme = t;
      $("#theme").textContent = THEME_LABEL[t];
      try { localStorage.setItem("dpgk-theme", t); } catch {}
    }
    let theme = "auto";
    try { theme = THEMES.includes(localStorage.getItem("dpgk-theme")) ? localStorage.getItem("dpgk-theme") : "auto"; } catch {}
    setTheme(theme);
    $("#theme").onclick = () => setTheme(theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]);

    // 全画面（対応ブラウザのみボタンを出す）。F キーでも切り替え
    const fs = $("#fs");
    const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (document.fullscreenEnabled) { fs.hidden = false; fs.onclick = toggleFs; }
    addEventListener("fullscreenchange", () => { fs.textContent = document.fullscreenElement ? "全画面を終了" : "全画面"; });

    $("#prev").onclick = () => { stop(); go(i - 1); };
    $("#next").onclick = () => { stop(); go(i + 1); };
    $("#play").onclick = () => (timer ? stop() : play());
    addEventListener("keydown", e => {
      if (e.target.closest("input, select, textarea")) return;
      if (e.key === "ArrowLeft") $("#prev").click();
      else if (e.key === "ArrowRight") $("#next").click();
      else if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); $("#play").click(); }
      else if ((e.key === "f" || e.key === "F") && document.fullscreenEnabled) toggleFs();
      // YouTube と同じ < > で速度を下げる・上げる
      else if (e.key === ">" || e.key === "<") {
        const n = RATES.indexOf(rate) + (e.key === ">" ? 1 : -1);
        setRate(RATES[Math.max(0, Math.min(RATES.length - 1, n))]);
      }
    });

    // #beat=3 で 3 番目のビートを遷移なしで表示する（共有リンクと dpgk_snap.py 用）
    const fromHash = () => Number((location.hash.match(/beat=(\d+)/) || [])[1]);
    // #beat=N&measure: 図の中で一番小さい文字が画面上で何 px になるかを親フレームに知らせる（dpgk_snap.py --measure 用）
    if (/measure/.test(location.hash)) setTimeout(() => {
      let min = Infinity, label = "";
      for (const t of document.querySelectorAll("#scene text")) {
        const m = t.getScreenCTM();
        if (!m || !t.textContent.trim() || t.closest(".off") || getComputedStyle(t).visibility === "hidden") continue;
        const px = parseFloat(getComputedStyle(t).fontSize) * Math.hypot(m.a, m.b);
        if (px < min) { min = px; label = t.textContent.trim().slice(0, 20); }
      }
      parent.postMessage({ dpgk: "measure", beat: i + 1, total: beats.length, orient: document.documentElement.dataset.orient, minFont: Math.round(min * 10) / 10, label }, "*");
    }, 300);
    addEventListener("hashchange", () => { stop(); go(fromHash() - 1); });
    if (fromHash()) {
      document.documentElement.style.setProperty("--dur", "0ms");
      go(fromHash() - 1);
    } else if (reduced) {
      go(beats.length - 1);   // 動きを減らす設定では、自動再生せず最終状態を見せる
      if (FEED) setTimeout(() => parent.postMessage({ dpgk: "ended" }, "*"), 8000);
    } else {
      go(0);
      play();
    }
  })();
  /* dpgk-player:end */
</script>
</body>
</html>
