<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="t d">
  <title id="t">TCP 3ウェイハンドシェイク</title>
  <desc id="d">クライアントが SYN、サーバーが SYN-ACK、クライアントが ACK を送り、両者が ESTABLISHED になるまでの流れ</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    text { font: 15px system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #1c1917; }
    .life { stroke: #a8a29e; stroke-width: 1.5; stroke-dasharray: 4 5; }
    .node { fill: #fff; stroke: #a8a29e; stroke-width: 1.5; }
    .msg line { stroke: #2563eb; stroke-width: 2; }
    .msg text { fill: #2563eb; font-weight: 700; }
    .est rect { fill: #dcfce7; stroke: #16a34a; }
    .est text { fill: #166534; font-size: 13px; font-weight: 700; }
    .dot { fill: #2563eb; }

    /* 1 本のタイムライン（10s）。素の状態は最終フレーム＝全部表示 */
    .m1 { animation: m1 10s ease-out infinite; }
    .m2 { animation: m2 10s ease-out infinite; }
    .m3 { animation: m3 10s ease-out infinite; }
    .est-c { animation: est-c 10s ease-out infinite; }
    .est-s { animation: est-s 10s ease-out infinite; }
    @keyframes m1  { 0%,24% { opacity: 0 } 27%,95% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes m2  { 0%,44% { opacity: 0 } 47%,95% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes m3  { 0%,64% { opacity: 0 } 67%,95% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes est-c { 0%,48% { opacity: 0 } 52%,95% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes est-s { 0%,68% { opacity: 0 } 72%,95% { opacity: 1 } 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dot { display: none; }
    }
  </style>

  <rect width="520" height="330" fill="#fafaf9"/>

  <rect class="node" x="50" y="20" width="120" height="40" rx="8"/>
  <text x="110" y="46" text-anchor="middle">クライアント</text>
  <rect class="node" x="350" y="20" width="120" height="40" rx="8"/>
  <text x="410" y="46" text-anchor="middle">サーバー</text>
  <line class="life" x1="110" y1="60" x2="110" y2="270"/>
  <line class="life" x1="410" y1="60" x2="410" y2="270"/>

  <g class="msg m1">
    <line x1="110" y1="90" x2="408" y2="130" marker-end="url(#ah)"/>
    <text x="260" y="98" text-anchor="middle">SYN</text>
  </g>
  <g class="msg m2">
    <line x1="410" y1="150" x2="112" y2="190" marker-end="url(#ah)"/>
    <text x="260" y="158" text-anchor="middle">SYN-ACK</text>
  </g>
  <g class="msg m3">
    <line x1="110" y1="210" x2="408" y2="250" marker-end="url(#ah)"/>
    <text x="260" y="218" text-anchor="middle">ACK</text>
  </g>

  <!-- パケットの移動（流れ）。到着した瞬間に矢印が確定する -->
  <circle class="dot" r="7" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" path="M110,90 L410,130" keyPoints="0;0;1;1" keyTimes="0;0.1;0.25;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.1;0.25;0.26;1"/>
  </circle>
  <circle class="dot" r="7" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" path="M410,150 L110,190" keyPoints="0;0;1;1" keyTimes="0;0.3;0.45;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3;0.3;0.45;0.46;1"/>
  </circle>
  <circle class="dot" r="7" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite" path="M110,210 L410,250" keyPoints="0;0;1;1" keyTimes="0;0.5;0.65;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.5;0.65;0.66;1"/>
  </circle>

  <!-- 因果: クライアントは SYN-ACK 受信後、サーバーは ACK 受信後に ESTABLISHED になる -->
  <g class="est est-c">
    <rect x="45" y="282" width="130" height="30" rx="6"/>
    <text x="110" y="302" text-anchor="middle">ESTABLISHED</text>
  </g>
  <g class="est est-s">
    <rect x="345" y="282" width="130" height="30" rx="6"/>
    <text x="410" y="302" text-anchor="middle">ESTABLISHED</text>
  </g>
</svg>
